name: Deploy to Fly

on:
  push:
    branches: [main]              # auto-deploy prod on merge to main
  workflow_dispatch:
    inputs:
      env:
        description: "Which environment to deploy to"
        type: choice
        options: [staging, prod]
        default: prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ inputs.env || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: mintmcp/mint-fly-deploy@main
        with:
          env: ${{ env.TARGET_ENV }}
          fly-app: ${{ env.TARGET_ENV == 'prod' && 'gdrive-mintmcp' || 'gdrive-mintmcp-staging' }}
          aws-role-arn: arn:aws:iam::519578939119:role/github-actions-fly-deploy
