# profile names a frozen scope and feature set from PROFILES in src/scopes.ts

- app: gdrive-mintmcp-staging
  env: staging
  live: true
  profile: standard # drive.readonly + drive.file

- app: gdrive-mintmcp
  env: prod
  live: true
  profile: standard # drive.readonly + drive.file

- app: gdrive-mintmcp-labels
  env: prod
  live: true
  profile: labels # standard + drive.labels.readonly

- app: gdrive-mintmcp-resources
  env: prod
  live: true
  profile: standard-resources # standard scopes + MCP resources
