# profile names a frozen scope set from PROFILES in src/scopes.ts

- app: gdrive-mintmcp-staging
  env: staging
  live: true
  profile: standard # drive.readonly + drive.file

- app: gdrive-mintmcp
  env: prod
  live: true
  profile: standard # drive.readonly + drive.file

# labels-enabled connector: flip live to true once the Fly app exists
- app: gdrive-mintmcp-labels
  env: prod
  live: false
  profile: labels # standard + drive.labels.readonly

# label-write-enabled connector: flip live to true once the Fly app exists.
# Do NOT go live without the write-grant gate middleware attached and an
# approval rule on set_file_label: without them label writes are ungated and
# drive.metadata widens update/move/trash to every user-accessible file
- app: gdrive-mintmcp-labels-write
  env: prod
  live: false
  profile: labels-write # labels + drive.metadata
